<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미니 게임 모음</title>
<style>
  :root {
    --bg: #14181f; --card: #1d232d; --ink: #eef1f6; --sub: #9aa6b8; --line: #2c3544; --accent: #ffcf5a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f1ea; --card: #fff; --ink: #222; --sub: #6b6b6b; --line: #e2ddd0; --accent: #c9742a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; }
  header { max-width: 1040px; margin: 0 auto; padding: 48px 16px 8px; }
  h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--sub); }
  .filters { max-width: 1040px; margin: 20px auto 0; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: .9rem; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent); color: #1a1a1a; border-color: transparent; font-weight: 600; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  a.card { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.25); outline: none; }
  .thumb { height: 110px; display: grid; place-items: center; font-size: 3rem; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h2 { margin: 0; font-size: 1.05rem; }
  .body p { margin: 0; color: var(--sub); font-size: .88rem; line-height: 1.45; flex: 1; }
  .tag { align-self: flex-start; font-size: .72rem; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  footer { text-align: center; color: var(--sub); font-size: .8rem; padding: 0 16px 40px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>미니 게임 모음</h1>
  <p>브라우저에서 바로 즐기는 작은 게임 18편과 유용한 앱 3개. 카드를 누르면 새 탭에서 열려요.</p>
</header>
<div class="filters" id="filters" role="group" aria-label="종류 필터"></div>
<main id="grid"></main>
<footer>키보드로 즐기는 게임이 많아요 · PC 권장</footer>
<script>
  const BASE = '/angular_pc/'
  const GAMES = [
    { path: '', name: '던전 RPG', desc: '마을과 던전은 물론, 숲길을 지나 단풍마을까지 모험하는 RPG.', tag: 'RPG', icon: '⚔️', grad: ['#3b2a5a', '#7a4a8a'] },
    { path: 'dating/', name: '동아리 연애 시뮬레이션', desc: '동아리에서 마음에 드는 상대와 친해지는 이야기.', tag: '시뮬레이션', icon: '💌', grad: ['#7a3a5a', '#d98aa8'] },
    { path: 'sailing/', name: '항해 시뮬레이션', desc: '바람을 읽어 항해하고, 항구에서 사고팔기·대화·정비까지 하는 항해 시뮬레이션.', tag: '시뮬레이션', icon: '⛵', grad: ['#1d4a7a', '#4aa3d8'] },
    { path: 'brawler/', name: '횡스크롤 액션', desc: '몰려오는 적을 때려눕히는 벨트스크롤 액션.', tag: '액션', icon: '👊', grad: ['#7a2f2f', '#d9704a'] },
    { path: 'island/', name: '아늑한 섬 생활', desc: '커다란 섬에서 낚시하고 꽃 따고 이웃과 친해지는 느긋한 하루.', tag: '시뮬레이션', icon: '🏝️', grad: ['#2f7a5a', '#8ad9a8'] },
    { path: 'city/', name: '미니시티 빌더', desc: '도로를 깔고 집·가게·공장을 지으면 저절로 자라는 쉬운 도시 만들기.', tag: '경영', icon: '🏙️', grad: ['#3a4a6a', '#8aa0c9'] },
    { path: 'daughter/', name: '딸 키우기', desc: '하루하루 일정을 짜서 아이를 키우는 육성 게임.', tag: '시뮬레이션', icon: '🎀', grad: ['#a85a7a', '#f0b0c8'] },
    { path: 'job/', name: '직장 시뮬레이터', desc: '집·거리·사무실을 직접 걸어 다니며 일하고 평가받는 탑뷰 직장 생활 8년. 연봉 협상·승진·이직까지.', tag: '시뮬레이션', icon: '💼', grad: ['#4a4a5a', '#9a9ab0'] },
    { path: 'strategy/', name: '천하제패', desc: '영토를 넓혀 천하를 통일하는 전략 게임.', tag: '전략', icon: '🏯', grad: ['#6a4a1f', '#d9a84a'] },
    { path: 'detective/', name: '모순 탐정', desc: '3막 사건의 증언 속 모순을 찾아 증거를 들이미는 추리극. 클릭 조사/탑뷰 조사 선택.', tag: '추리', icon: '🔍', grad: ['#2a2f4a', '#6a74b8'] },
    { path: 'robot/', name: '로봇 시뮬레이터', desc: '로봇을 직접 조종해 보는 3D 시뮬레이션.', tag: '3D', icon: '🤖', grad: ['#2f4a5a', '#5ab8d9'] },
    { path: '3d/', name: '3D 프로토타입', desc: '3D 캐릭터를 움직이며 둘러보는 프로토타입.', tag: '3D', icon: '🧊', grad: ['#3a5a3a', '#8ad98a'] },
    { path: 'learn2d/', name: '2D 게임 배우기', desc: '2D 게임 만들기의 기본기를 직접 만져 보며 배우는 학습용.', tag: '학습', icon: '📐', grad: ['#5a4a2f', '#d9c08a'] },
    { path: 'learn3d/', name: '3D 게임 배우기', desc: '3D 게임 만들기의 기본기를 직접 만져 보며 배우는 학습용.', tag: '학습', icon: '📦', grad: ['#4a2f5a', '#b88ad9'] },
    { path: 'relay/', name: '마지막 중계소', desc: '버려진 중계소를 돌며 부품을 모아 스스로를 강화하는 탑다운 액션.', tag: '액션', icon: '📡', grad: ['#1d2a3a', '#4a7aa8'] },
    { path: 'topview/', name: '탑뷰 어드벤처', desc: '마을을 거닐며 사람과 대화하고 열쇠를 찾는 탑뷰 어드벤처.', tag: '어드벤처', icon: '🗝️', grad: ['#3a5a2f', '#a8c86a'] },
    { path: 'tunguska/', name: '퉁구스카의 비밀', desc: '눈보라 속 버려진 소련 연구 기지의 단서를 조사하는 방탈출 어드벤처.', tag: '추리', icon: '❄️', grad: ['#2a3a4a', '#8aa8c0'] },
    { path: 'robotbuilder/', name: '메이드로봇 만들기', desc: '부품을 골라 메이드로봇을 조립한 뒤, 이동·말·동작·가사를 가르쳐 키우는 시뮬레이터.', tag: '시뮬레이션', icon: '🛠️', grad: ['#a85a7a', '#f0a0b8'] },
    { path: 'todo/', name: '할 일 목록', desc: '마감일·중요 표시·진행률까지, 자동 저장되는 깔끔한 할 일 관리.', tag: '앱', icon: '✅', grad: ['#2f5fb8', '#6c97ff'] },
    { path: 'budget/', name: '가계부', desc: '수입·지출을 기록하고 월별 잔액과 분류별 지출을 한눈에. CSV 내보내기 지원.', tag: '앱', icon: '💰', grad: ['#2f7a5a', '#6bd1a0'] },
    { path: 'timer/', name: '집중 타이머', desc: '포모도로, 카운트다운 타이머, 랩 스톱워치를 한곳에서.', tag: '앱', icon: '⏱️', grad: ['#b8503a', '#ff9a7a'] },
  ]
  const grid = document.getElementById('grid')
  const filters = document.getElementById('filters')
  const tags = ['전체', ...new Set(GAMES.map((g) => g.tag))]
  let current = '전체'
  function render() {
    grid.innerHTML = ''
    for (const g of GAMES) {
      const a = document.createElement('a')
      a.className = 'card' + (current !== '전체' && g.tag !== current ? ' hidden' : '')
      a.href = BASE + g.path
      a.target = '_blank'
      a.rel = 'noopener'
      a.innerHTML = `<div class="thumb" style="background:linear-gradient(135deg,${g.grad[0]},${g.grad[1]})" aria-hidden="true">${g.icon}</div>
        <div class="body"><h2></h2><p></p><span class="tag"></span></div>`
      a.querySelector('h2').textContent = g.name
      a.querySelector('p').textContent = g.desc
      a.querySelector('.tag').textContent = g.tag
      grid.appendChild(a)
    }
    filters.innerHTML = ''
    for (const t of tags) {
      const b = document.createElement('button')
      b.textContent = t
      b.setAttribute('aria-pressed', String(t === current))
      b.onclick = () => { current = t; render() }
      filters.appendChild(b)
    }
  }
  render()
</script>
</body>
</html>
