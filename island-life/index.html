<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아늑한 섬 생활</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1c2a1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        color: #eee;
        gap: 0.75rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      canvas {
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        image-rendering: pixelated;
        max-width: 100%;
      }
      #hint {
        font-size: 0.85rem;
        opacity: 0.8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">WASD/방향키 이동 · 스페이스 상호작용(나무/낚시/대화/상점/잠자기) · 조개는 밟으면 자동 획득</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
