<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>횡스크롤 액션</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #140e24;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: #eee;
        gap: 0.75rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      canvas {
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        max-width: 100%;
      }
      #hint {
        font-size: 0.85rem;
        opacity: 0.8;
        text-align: center;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">A/D 이동 · W/S 앞뒤(깊이) 이동 · J 펀치 · K 킥 · L 필살기(게이지 가득 찼을 때) · R 키로 재시작</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
