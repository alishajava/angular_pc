name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vue-coii3t
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -- --base=/angular_pc/
      - run: npm ci
        working-directory: 3d-prototype
      - run: npm run build -- --base=/angular_pc/3d/
        working-directory: 3d-prototype
      - run: mkdir -p dist/3d && cp -r 3d-prototype/dist/. dist/3d/
      - run: npm ci
        working-directory: dating-sim
      - run: npm run build -- --base=/angular_pc/dating/
        working-directory: dating-sim
      - run: mkdir -p dist/dating && cp -r dating-sim/dist/. dist/dating/
      - run: npm ci
        working-directory: sailing-sim
      - run: npm run build -- --base=/angular_pc/sailing/
        working-directory: sailing-sim
      - run: mkdir -p dist/sailing && cp -r sailing-sim/dist/. dist/sailing/
      - run: npm ci
        working-directory: brawler
      - run: npm run build -- --base=/angular_pc/brawler/
        working-directory: brawler
      - run: mkdir -p dist/brawler && cp -r brawler/dist/. dist/brawler/
      - run: npm ci
        working-directory: sengoku-strategy
      - run: npm run build -- --base=/angular_pc/strategy/
        working-directory: sengoku-strategy
      - run: mkdir -p dist/strategy && cp -r sengoku-strategy/dist/. dist/strategy/
      - run: npm ci
        working-directory: island-life
      - run: npm run build -- --base=/angular_pc/island/
        working-directory: island-life
      - run: mkdir -p dist/island && cp -r island-life/dist/. dist/island/
      - run: npm ci
        working-directory: city-builder
      - run: npm run build -- --base=/angular_pc/city/
        working-directory: city-builder
      - run: mkdir -p dist/city && cp -r city-builder/dist/. dist/city/
      - run: mkdir -p dist/learn2d && cp learn-2d/index.html dist/learn2d/
      - run: npm ci
        working-directory: learn-3d
      - run: npm run build -- --base=/angular_pc/learn3d/
        working-directory: learn-3d
      - run: mkdir -p dist/learn3d && cp -r learn-3d/dist/. dist/learn3d/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
