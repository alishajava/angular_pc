<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>항해 시뮬레이션</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0c1b2a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: #eee;
        gap: 0.75rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      canvas {
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        max-width: 100%;
      }
      #hint {
        font-size: 0.85rem;
        opacity: 0.8;
        text-align: center;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">A/D 또는 ←/→ 로 조타 · 바람 쪽으로 너무 붙이면 속도가 떨어져요, 지그재그로 역풍을 돌파하세요(태킹) · 항구(⚓)에 정박하면 화물을 싣고 다른 항구로 배달해 골드를 벌 수 있어요 · 가끔 태풍(소용돌이 구름)이 발생해요, 안에 들어가면 조타가 불안정해지고 화물을 잃을 수 있으니 점선 경고 범위를 보고 피해가세요 · R 키로 재시작</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
