<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메이드로이드</title>
    <style>
      :root {
        --teal: #3fd0c9;
        --dark: #10151d;
        --panel: #161e29;
        --ink: #dfeef0;
        --soft: #27333f;
        --core: #3fd0c9;
      }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: radial-gradient(circle at 50% 0%, #1b2530 0%, #0b0f15 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: var(--ink);
        padding: 1rem;
        box-sizing: border-box;
      }
      #app {
        width: 100%;
        max-width: 860px;
        min-height: 560px;
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(63, 208, 201, 0.15);
        background: var(--dark);
      }

      /* ---------- Title ---------- */
      .title-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        min-height: 560px;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        background: radial-gradient(circle at 50% 15%, #1c2733 0%, #10151d 70%);
      }
      .title-wrap h1 { font-size: clamp(1.5rem, 5vw, 2.3rem); margin: 0 0 0.4rem; color: var(--teal); text-shadow: 0 0 14px rgba(63,208,201,0.5); }
      .title-wrap .subtitle { opacity: 0.75; font-size: clamp(0.78rem, 2vw, 0.92rem); margin-bottom: 1.6rem; line-height: 1.6; max-width: 480px; }
      .field-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; width: 100%; max-width: 320px; }
      .field-row label { font-size: 0.82rem; font-weight: bold; text-align: left; }
      .field-row input {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.55rem 0.8rem;
        border-radius: 10px;
        border: 1px solid var(--soft);
        background: #0e1420;
        color: var(--ink);
      }
      .swatch-row { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.2rem; }
      .swatch {
        width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
        border: 3px solid transparent; box-sizing: border-box;
      }
      .swatch.selected { border-color: var(--teal); }
      .primary-btn {
        font-family: inherit;
        padding: 0.75rem 2.2rem;
        background: linear-gradient(180deg, #3fd0c9, #27a39d);
        color: #06110f;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(63, 208, 201, 0.4);
      }
      .hint { font-size: 0.72rem; opacity: 0.6; margin-top: 0.8rem; max-width: 440px; line-height: 1.6; }

      /* ---------- Main game ---------- */
      .game-wrap { display: flex; flex-direction: column; height: 100%; min-height: 560px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.7rem 1.1rem; background: linear-gradient(90deg, #163a38, #10151d); color: var(--ink);
        font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid var(--soft);
      }
      .topbar .money { opacity: 0.95; color: #ffd27a; }
      .body-row { display: flex; flex: 1; min-height: 0; }
      .portrait-col {
        flex: 0 0 240px;
        display: flex; flex-direction: column; align-items: center;
        padding: 1rem 0.8rem; background: linear-gradient(180deg, #141c26 0%, #0e141d 100%);
        border-right: 1px solid var(--soft);
      }
      .portrait-col canvas { width: 200px; height: 240px; }
      .droid-name { font-size: 1.05rem; font-weight: bold; margin-top: 0.2rem; }
      .droid-day { font-size: 0.75rem; opacity: 0.65; margin-bottom: 0.6rem; }
      .mood-tag {
        font-size: 0.72rem; padding: 0.2rem 0.7rem; border-radius: 999px;
        background: #0e1420; border: 1px solid var(--soft); margin-top: 0.3rem;
      }

      .stats-col { flex: 1; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; }
      .stat-row { display: flex; align-items: center; gap: 0.6rem; }
      .stat-label { width: 56px; font-size: 0.78rem; font-weight: bold; flex-shrink: 0; }
      .stat-bar-bg { flex: 1; height: 12px; border-radius: 999px; background: #0c1119; overflow: hidden; border: 1px solid var(--soft); }
      .stat-bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
      .stat-val { width: 30px; font-size: 0.72rem; text-align: right; opacity: 0.7; flex-shrink: 0; }
      .core-row .stat-bar-fill { box-shadow: 0 0 8px rgba(63,208,201,0.7); }

      .log-box {
        margin-top: 0.6rem; background: #0e1420; border: 1px solid var(--soft); border-radius: 10px;
        padding: 0.6rem 0.8rem; font-size: 0.78rem; line-height: 1.5; min-height: 3.2rem; white-space: pre-wrap;
      }

      .activity-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.7rem;
      }
      .activity-btn {
        font-family: inherit; text-align: left; padding: 0.55rem 0.7rem; border-radius: 10px;
        border: 1px solid var(--soft); background: #0e1420; cursor: pointer; font-size: 0.78rem; color: var(--ink);
      }
      .activity-btn:hover { background: #142030; border-color: var(--teal); }
      .activity-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .activity-btn .act-name { font-weight: bold; display: block; margin-bottom: 0.15rem; }
      .activity-btn .act-desc { opacity: 0.65; font-size: 0.7rem; }

      .continue-btn {
        font-family: inherit; margin-top: 0.6rem; align-self: flex-end; padding: 0.5rem 1.2rem;
        border-radius: 10px; border: none; background: linear-gradient(180deg, #3fd0c9, #27a39d); color: #06110f; font-weight: bold;
        font-size: 0.82rem; cursor: pointer;
      }

      /* ---------- Ending ---------- */
      .ending-wrap {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; height: 100%; min-height: 560px; padding: 2rem 1.6rem; box-sizing: border-box;
        background: radial-gradient(circle at 50% 10%, #1c2733 0%, #0b0f15 100%);
      }
      .ending-wrap canvas { margin-bottom: 0.8rem; }
      .ending-title { font-size: clamp(1.3rem, 4vw, 1.8rem); color: var(--teal); margin: 0 0 0.6rem; text-shadow: 0 0 12px rgba(63,208,201,0.45); }
      .ending-text { font-size: 0.88rem; line-height: 1.75; max-width: 480px; margin-bottom: 1rem; white-space: pre-wrap; opacity: 0.92; }
      .ending-stats { font-size: 0.75rem; opacity: 0.65; margin-bottom: 1.2rem; }
      .restart-btn {
        font-family: inherit; padding: 0.6rem 1.6rem; background: linear-gradient(180deg, #3fd0c9, #27a39d); color: #06110f;
        font-weight: bold; border: none; border-radius: 10px; font-size: 0.88rem; cursor: pointer;
      }

      @media (max-width: 640px) {
        .body-row { flex-direction: column; }
        .portrait-col { flex-direction: row; flex: 0 0 auto; border-right: none; border-bottom: 1px solid var(--soft); gap: 0.8rem; }
        .portrait-col canvas { width: 110px; height: 132px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
