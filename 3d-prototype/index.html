<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 프로토타입</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
        font-family: sans-serif;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #eee;
        font-size: 13px;
        opacity: 0.8;
        text-shadow: 0 1px 2px #000;
      }
      #quest-banner {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 16, 10, 0.72);
        color: #ffe9a8;
        padding: 8px 20px;
        border-radius: 8px;
        font-size: 14px;
        text-shadow: 0 1px 2px #000;
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        max-width: 80vw;
        text-align: center;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hint">WASD/방향키 이동 · Space 점프 · 클릭 후 마우스로 시점 회전 · V 키로 1인칭/3인칭 전환 · 차 근처에서 E 키로 탑승 · NPC에게 다가가면 인사해요</div>
    <div id="quest-banner"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
