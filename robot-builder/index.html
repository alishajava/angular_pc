<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메이드로봇 만들기 시뮬레이터</title>
    <style>
      :root {
        --amber: #ff8fab;
        --steel: #2a3038;
        --steel-dark: #171b20;
        --panel: #1e242b;
        --ink: #e8edf2;
        --soft: #343c46;
      }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: radial-gradient(circle at 50% 0%, #22282f 0%, #121519 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: var(--ink);
        padding: 1rem;
        box-sizing: border-box;
      }
      #app {
        width: 100%;
        max-width: 900px;
        min-height: 580px;
        transition: max-width 0.2s;
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 143, 171, 0.14);
        background: var(--steel-dark);
      }

      /* ---------- Title ---------- */
      .title-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        min-height: 580px;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        background: radial-gradient(circle at 50% 12%, #262c33 0%, #121519 70%);
      }
      .title-wrap h1 { font-size: clamp(1.5rem, 5vw, 2.3rem); margin: 0 0 0.4rem; color: var(--amber); text-shadow: 0 0 14px rgba(255,159,63,0.4); letter-spacing: 0.02em; }
      .title-wrap .subtitle { opacity: 0.75; font-size: clamp(0.78rem, 2vw, 0.92rem); margin-bottom: 1.6rem; line-height: 1.6; max-width: 480px; }
      .field-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.2rem; width: 100%; max-width: 320px; }
      .field-row label { font-size: 0.82rem; font-weight: bold; text-align: left; }
      .field-row input {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.55rem 0.8rem;
        border-radius: 8px;
        border: 1px solid var(--soft);
        background: #0f1215;
        color: var(--ink);
      }
      .primary-btn {
        font-family: inherit;
        padding: 0.75rem 2.2rem;
        background: linear-gradient(180deg, #ffa8c0, #ec6f94);
        color: #3a0e1f;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(255, 143, 171, 0.4);
      }
      .hint { font-size: 0.72rem; opacity: 0.6; margin-top: 0.8rem; max-width: 460px; line-height: 1.6; }

      /* ---------- Build wizard ---------- */
      .build-wrap { display: flex; flex-direction: column; height: 100%; min-height: 580px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.7rem 1.1rem; background: linear-gradient(90deg, #2b2116, #171b20); color: var(--ink);
        font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid var(--soft);
      }
      .topbar .step-tag { color: var(--amber); }
      .body-row { display: flex; flex: 1; min-height: 0; }
      .preview-col {
        flex: 0 0 280px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 1rem 0.8rem; background: linear-gradient(180deg, #1c2127 0%, #121519 100%);
        border-right: 1px solid var(--soft);
      }
      .preview-col canvas { width: 230px; height: 280px; }
      .robot-name { font-size: 1.05rem; font-weight: bold; margin-top: 0.4rem; }
      .stat-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 0.7rem; margin-top: 0.8rem; width: 100%; max-width: 220px; }
      .stat-mini { font-size: 0.68rem; display: flex; justify-content: space-between; opacity: 0.85; }
      .stat-mini b { color: var(--amber); }

      .option-col { flex: 1; padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; overflow-y: auto; }
      .option-col h2 { margin: 0 0 0.3rem; font-size: 1rem; color: var(--amber); }
      .option-card {
        font-family: inherit; text-align: left; padding: 0.65rem 0.85rem; border-radius: 10px;
        border: 1px solid var(--soft); background: #1a1f25; cursor: pointer; color: var(--ink); width: 100%;
      }
      .option-card:hover { border-color: var(--amber); background: #221c14; }
      .option-card.selected { border-color: var(--amber); background: #2a2014; box-shadow: 0 0 0 1px rgba(255,159,63,0.4) inset; }
      .option-card .opt-name { font-weight: bold; display: block; margin-bottom: 0.15rem; font-size: 0.86rem; }
      .option-card .opt-desc { opacity: 0.65; font-size: 0.72rem; }
      .swatch-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.3rem; }
      .swatch {
        width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
        border: 3px solid transparent; box-sizing: border-box;
      }
      .swatch.selected { border-color: var(--amber); }

      .wizard-nav { display: flex; justify-content: space-between; margin-top: 0.8rem; }
      .nav-btn {
        font-family: inherit; padding: 0.55rem 1.3rem; border-radius: 9px; border: 1px solid var(--soft);
        background: #1a1f25; color: var(--ink); font-size: 0.82rem; cursor: pointer;
      }
      .nav-btn.primary { background: linear-gradient(180deg, #ffa8c0, #ec6f94); color: #3a0e1f; font-weight: bold; border: none; }
      .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      /* ---------- Result ---------- */
      .result-wrap {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; height: 100%; min-height: 580px; padding: 2rem 1.6rem; box-sizing: border-box;
        background: radial-gradient(circle at 50% 10%, #262c33 0%, #121519 100%);
      }
      .result-wrap canvas { margin-bottom: 0.4rem; width: 230px; height: 280px; }
      .result-title { font-size: clamp(1.2rem, 4vw, 1.6rem); color: var(--amber); margin: 0 0 0.5rem; text-shadow: 0 0 10px rgba(255,159,63,0.35); }
      .result-verdict { font-size: 0.9rem; line-height: 1.7; max-width: 480px; margin-bottom: 1rem; opacity: 0.92; }
      .result-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6rem; max-width: 520px; width: 100%; margin-bottom: 1.4rem; }
      .result-stat { background: #1a1f25; border: 1px solid var(--soft); border-radius: 8px; padding: 0.5rem 0.3rem; }
      .result-stat .label { font-size: 0.66rem; opacity: 0.7; }
      .result-stat .value { font-size: 1.05rem; font-weight: bold; color: var(--amber); }
      .restart-btn {
        font-family: inherit; padding: 0.6rem 1.6rem; background: linear-gradient(180deg, #ffa8c0, #ec6f94); color: #3a0e1f;
        font-weight: bold; border: none; border-radius: 9px; font-size: 0.88rem; cursor: pointer;
      }

      .bar { flex: 0 0 100%; display: block; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
      .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fab, #ffd2e0); border-radius: 3px; transition: width 0.4s ease; }
      .stat-mini { flex-wrap: wrap; gap: 0.1rem 0.4rem; }
      .stat-mini span { flex: 1; }
      .result-stat .bar { margin-top: 0.35rem; }
      .option-card { transition: transform 0.12s, border-color 0.12s, background 0.12s; }
      .option-card:hover { transform: translateX(3px); }
      .primary-btn, .nav-btn.primary, .restart-btn { transition: transform 0.12s, box-shadow 0.12s; }
      .primary-btn:hover, .nav-btn.primary:hover:not(:disabled), .restart-btn:hover { transform: translateY(-2px); }
      .title-wrap canvas { margin-bottom: 0.4rem; }
      .result-title { animation: pop 0.6s ease-out; }
      @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

      /* ---------- Training ---------- */
      #app.wide { max-width: 1040px; }
      .continue-btn { margin-top: 0.6rem; }
      .result-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
      .train-wrap { display: flex; flex-direction: column; min-height: 580px; }
      .train-body { display: flex; flex: 1; min-height: 0; }
      .stage-col { flex: 1 1 60%; padding: 0.8rem; display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
      .stage-box { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
      .stage-box canvas { width: 100%; display: block; aspect-ratio: 16 / 9; }
      .hud { display: flex; flex-direction: column; gap: 0.35rem; }
      .hud-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; }
      .hud-row .hud-label { width: 4.6rem; opacity: 0.85; }
      .hud-row .bar { flex: 1; height: 8px; }
      .hud-row b { width: 2.2rem; text-align: right; color: var(--amber); }
      .stage-actions { display: flex; gap: 0.6rem; }
      .side-col { flex: 0 0 340px; border-left: 1px solid var(--soft); background: #181c22; display: flex; flex-direction: column; min-height: 0; max-height: 640px; }
      .tabs { display: flex; border-bottom: 1px solid var(--soft); }
      .tab { flex: 1; font-family: inherit; background: transparent; color: var(--ink); border: none; padding: 0.7rem 0.2rem; font-size: 0.82rem; cursor: pointer; opacity: 0.6; border-bottom: 2px solid transparent; }
      .tab.on { opacity: 1; border-bottom-color: var(--amber); color: var(--amber); font-weight: bold; }
      .tab-body { padding: 0.7rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.45rem; }
      .cat-title { font-size: 0.78rem; font-weight: bold; color: var(--amber); margin-top: 0.3rem; }
      .cat-title small { opacity: 0.7; font-weight: normal; }
      .skill-card, .req-card, .phrase-card { font-family: inherit; text-align: left; display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.65rem; border-radius: 10px; border: 1px solid var(--soft); background: #1d2229; color: var(--ink); cursor: pointer; }
      .skill-card:hover:not(:disabled), .req-card:hover:not(:disabled), .phrase-card:hover { border-color: var(--amber); }
      .skill-card.learned { border-color: rgba(120,220,160,0.5); }
      .skill-card:disabled, .req-card:disabled { cursor: not-allowed; opacity: 0.55; }
      .sk-icon { font-size: 1.4rem; width: 2rem; text-align: center; }
      .sk-main { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
      .sk-main b { font-size: 0.84rem; }
      .sk-main small { font-size: 0.68rem; opacity: 0.65; line-height: 1.35; }
      .sk-main .bar { margin-top: 0.2rem; }
      .sk-main .need { color: #ffc9d6; opacity: 0.9; }
      .sk-state { font-size: 0.68rem; opacity: 0.85; text-align: right; flex-shrink: 0; }
      .phrase-card { font-size: 0.82rem; }
      .phrase-card span { color: var(--amber); width: 1rem; }
      .phrase-card b { flex: 1; }
      .phrase-card small { font-size: 0.66rem; opacity: 0.6; }
      .phrase-card.known { border-color: rgba(120,220,160,0.4); }
      .locked-note, .tip, .muted { font-size: 0.72rem; opacity: 0.65; line-height: 1.5; }
      .tip { margin-top: 0.4rem; padding: 0.5rem 0.6rem; background: rgba(255,255,255,0.04); border-radius: 8px; }
      .info-title { font-size: 1.05rem; font-weight: bold; color: var(--amber); }
      .info-sub { font-size: 0.75rem; opacity: 0.75; }
      .info-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.8rem; margin: 0.3rem 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .chip-ok { font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 999px; background: rgba(120,220,160,0.12); border: 1px solid rgba(120,220,160,0.35); }
      .train-toast { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 20px); background: rgba(20,14,22,0.92); color: #fff; padding: 0.5rem 0.9rem; border-radius: 999px; font-size: 0.82rem; opacity: 0; transition: all 0.25s; pointer-events: none; border: 1px solid rgba(255,159,63,0.5); max-width: 90%; text-align: center; }
      .train-toast.show { opacity: 1; transform: translate(-50%, 0); }
      /* teaching mini-games */
      .mini { position: absolute; inset: 0; background: rgba(16,10,18,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; padding: 1rem; text-align: center; }
      .mini.hidden { display: none; }
      .mini h3 { margin: 0; color: var(--amber); font-size: 1.05rem; }
      .mini p { margin: 0; font-size: 0.85rem; opacity: 0.9; }
      .dots { display: flex; gap: 0.4rem; }
      .dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.15); }
      .dots i.ok { background: #6ee2a0; }
      .dots i.bad { background: #ff6b8a; }
      .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; grid-template-areas: '. up .' 'left down right'; }
      .arrow { font-size: 1.4rem; border-radius: 12px; border: 2px solid var(--soft); background: #222831; color: #fff; cursor: pointer; font-family: inherit; }
      .arrow[data-dir="up"] { grid-area: up; } .arrow[data-dir="left"] { grid-area: left; } .arrow[data-dir="down"] { grid-area: down; } .arrow[data-dir="right"] { grid-area: right; }
      .arrow.lit { background: var(--amber); color: #3a0e1f; border-color: #fff; transform: scale(1.08); box-shadow: 0 0 16px rgba(255,143,171,0.8); }
      .arrow:disabled { cursor: default; }
      .listen { display: flex; gap: 0.3rem; font-size: 1.6rem; font-weight: bold; }
      .listen span { opacity: 0.15; transition: opacity 0.15s; }
      .listen span.on { opacity: 1; color: var(--amber); }
      .slots { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }
      .slot { width: 34px; height: 40px; border-bottom: 3px solid rgba(255,255,255,0.35); font-style: normal; font-size: 1.4rem; font-weight: bold; display: grid; place-items: center; }
      .slot.filled { border-bottom-color: var(--amber); color: var(--amber); }
      .chips-row { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; max-width: 420px; }
      .chip-btn { font-family: inherit; font-size: 1.3rem; font-weight: bold; width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--soft); background: #222831; color: #fff; cursor: pointer; }
      .chip-btn.used { opacity: 0.2; }
      .chip-btn.shake { animation: shake 0.3s; border-color: #ff6b8a; }
      @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      .mini-result { font-size: 0.95rem; font-weight: bold; padding: 0.4rem 0.8rem; border-radius: 8px; }
      .mini-result.pass { color: #6ee2a0; background: rgba(110,226,160,0.1); }
      .mini-result.fail { color: #ff8aa0; background: rgba(255,106,138,0.1); }
      .muted.small { font-size: 0.7rem; }
      @media (max-width: 860px) {
        .train-body { flex-direction: column; }
        .side-col { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--soft); max-height: none; }
      }

      @media (max-width: 640px) {
        .body-row { flex-direction: column; }
        .preview-col { flex: 0 0 auto; border-right: none; border-bottom: 1px solid var(--soft); }
        .preview-col canvas { width: 160px; height: 180px; }
        .result-stats { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
