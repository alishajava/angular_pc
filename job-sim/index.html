<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>직장 시뮬레이터</title>
    <style>
      :root {
        --blue: #3f6fd1;
        --cream: #eef2f8;
        --panel: #ffffff;
        --ink: #2a3140;
        --soft: #d7e0ee;
      }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: linear-gradient(160deg, #dde6f5 0%, #c7d4ec 45%, #b7c6e4 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: var(--ink);
        padding: 1rem;
        box-sizing: border-box;
      }
      #app {
        width: 100%;
        max-width: 860px;
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 48px rgba(30, 50, 90, 0.28);
        background: #1a2236;
        aspect-ratio: 800 / 576;
      }
      #game { width: 100%; height: 100%; display: block; }
      #overlay {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 16, 34, 0.55); overflow-y: auto; padding: 0.6rem; box-sizing: border-box;
      }
      #overlay.on { display: flex; }
      #overlay.solid { background: linear-gradient(160deg, #dde6f5 0%, #c7d4ec 45%, #b7c6e4 100%); }
      .modal {
        width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--cream); border-radius: 16px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4); padding: 1rem 1.2rem 1.1rem; box-sizing: border-box;
        display: flex; flex-direction: column; gap: 0.5rem;
      }
      .modal-title { font-size: 1.05rem; font-weight: bold; color: #2a4fa0; }
      .modal-body { display: flex; flex-direction: column; gap: 0.4rem; }
      .modal-btns { display: flex; justify-content: flex-end; }

      /* ---------- Title ---------- */
      .title-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        padding: 1rem 1.5rem;
        box-sizing: border-box;
      }
      .title-wrap h1 { font-size: clamp(1.5rem, 5vw, 2.3rem); margin: 0 0 0.4rem; color: #2a4fa0; }
      .title-wrap .subtitle { opacity: 0.75; font-size: clamp(0.8rem, 2vw, 0.95rem); margin-bottom: 1.6rem; }
      .field-row { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; width: 100%; max-width: 320px; }
      .field-row label { font-size: 0.82rem; font-weight: bold; text-align: left; }
      .field-row input {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.55rem 0.8rem;
        border-radius: 10px;
        border: 1px solid #aebedd;
        background: #fff;
        color: var(--ink);
      }
      .swatch-row { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.2rem; }
      .swatch {
        width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
        border: 3px solid transparent; box-sizing: border-box;
      }
      .swatch.selected { border-color: #2a4fa0; }
      .primary-btn {
        font-family: inherit;
        padding: 0.75rem 2.2rem;
        background: var(--blue);
        color: #fff;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(63, 111, 209, 0.45);
      }
      .hint { font-size: 0.72rem; opacity: 0.6; margin-top: 0.8rem; max-width: 420px; line-height: 1.5; }

      /* ---------- Common ---------- */
      .log-box {
        background: #fff; border: 1px solid var(--soft); border-radius: 10px;
        padding: 0.6rem 0.8rem; font-size: 0.78rem; line-height: 1.5; white-space: pre-wrap;
      }
      .continue-btn {
        font-family: inherit; margin-top: 0.4rem; padding: 0.5rem 1.2rem;
        border-radius: 10px; border: none; background: var(--blue); color: #fff; font-weight: bold;
        font-size: 0.82rem; cursor: pointer;
      }

      /* ---------- Ending ---------- */
      .ending-wrap {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; width: 100%; padding: 1rem 1.2rem; box-sizing: border-box;
      }
      .ending-wrap canvas { margin-bottom: 0.8rem; }
      .ending-title { font-size: clamp(1.3rem, 4vw, 1.8rem); color: #2a4fa0; margin: 0 0 0.6rem; }
      .ending-text { font-size: 0.88rem; line-height: 1.7; max-width: 480px; margin-bottom: 1rem; white-space: pre-wrap; }
      .ending-stats { font-size: 0.75rem; opacity: 0.7; margin-bottom: 1.2rem; }
      .restart-btn {
        font-family: inherit; padding: 0.6rem 1.6rem; background: var(--blue); color: #fff;
        font-weight: bold; border: none; border-radius: 10px; font-size: 0.88rem; cursor: pointer;
      }

      /* ---------- Career: salary, review, offers ---------- */
      .topbar .salary { opacity: 0.95; }
      .worker-company { font-size: 0.78rem; font-weight: bold; margin-top: 0.1rem; color: #2a4fa0; }
      .worker-company small { margin-left: 0.35rem; font-weight: normal; opacity: 0.6; }
      .pay-line { display: flex; gap: 0.8rem; align-items: center; margin-top: 0.4rem; font-size: 0.74rem; padding: 0.4rem 0.7rem; background: #f3f7ff; border: 1px dashed #b9c9e6; border-radius: 8px; }
      .pay-line b { margin-left: auto; color: #2a7a4f; }
      .review-card { background: #fff; border: 1px solid var(--soft); border-radius: 12px; padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.4rem; }
      .review-head { display: flex; align-items: center; gap: 0.9rem; }
      .grade { width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; font-size: 2rem; font-weight: 800; color: #fff; flex-shrink: 0; }
      .grade-S { background: linear-gradient(135deg, #f5b942, #e0752a); }
      .grade-A { background: linear-gradient(135deg, #5fbf88, #2f9a66); }
      .grade-B { background: linear-gradient(135deg, #6a93e0, #3f6fd1); }
      .grade-C { background: linear-gradient(135deg, #a9b0c2, #7e869c); }
      .grade-D { background: linear-gradient(135deg, #e07a7a, #c04a4a); }
      .review-title { font-weight: bold; font-size: 0.95rem; }
      .review-sub { font-size: 0.7rem; opacity: 0.65; margin-top: 0.15rem; }
      .review-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.35rem 0; border-top: 1px solid #eef2f8; }
      .review-row em { font-style: normal; color: #2a7a4f; margin-left: 0.4rem; }
      .promo { background: #fff6dc; border: 1px solid #f0d88a; color: #8a5a00; border-radius: 8px; padding: 0.5rem 0.7rem; font-weight: bold; font-size: 0.85rem; }
      .review-note { font-size: 0.72rem; opacity: 0.65; }
      .offer-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
      .offer-card { background: #fff; border: 1px solid var(--soft); border-radius: 12px; padding: 0.6rem 0.8rem; display: flex; flex-direction: column; gap: 0.25rem; }
      .offer-head { display: flex; align-items: center; gap: 0.4rem; font-size: 0.92rem; }
      .tag { font-size: 0.66rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: #e8eefb; color: #2a4fa0; }
      .tag.up-tag { background: #fff0c8; color: #8a5a00; }
      .offer-line { font-size: 0.82rem; }
      .offer-line em { font-style: normal; font-size: 0.74rem; margin-left: 0.3rem; }
      .offer-line .up { color: #2a7a4f; } .offer-line .down { color: #c04a4a; }
      .offer-note { font-size: 0.7rem; opacity: 0.65; }
      .offer-actions { display: flex; gap: 0.4rem; margin-top: 0.2rem; }
      .mini-btn { font-family: inherit; font-size: 0.74rem; padding: 0.35rem 0.8rem; border-radius: 8px; border: 1px solid var(--soft); background: #f4f7fc; cursor: pointer; color: var(--ink); }
      .mini-btn.go { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: bold; }
      .mini-btn:disabled { opacity: 0.45; cursor: default; }
      .offer-tip { font-size: 0.7rem; opacity: 0.6; margin-top: 0.4rem; line-height: 1.5; }
      .muted { opacity: 0.6; font-size: 0.8rem; }
      .career { font-size: 0.74rem; max-width: 460px; text-align: left; margin-bottom: 1rem; }
      .career summary { cursor: pointer; text-align: center; opacity: 0.75; }
      .career ul { margin: 0.4rem 0 0; padding-left: 1.1rem; line-height: 1.6; }

      #mute-btn {
        position: fixed;
        top: 10px;
        right: 12px;
        background: rgba(0, 0, 0, 0.08);
        color: inherit;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
        font-size: 0.8rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas><div id="overlay"></div></div>
    <div id="hint2" style="font-size:.78rem;opacity:.65;margin-top:.6rem;text-align:center">방향키/WASD 이동 · E/Space 상호작용 · 숫자키/클릭 선택 · Esc 닫기 · M 소리</div>
    <button id="mute-btn" type="button">소리 켬</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
