<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미니시티 빌더</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1b2420;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        color: #eee;
        gap: 0.75rem;
        padding: 1rem;
        box-sizing: border-box;
      }
      #stage {
        position: relative;
        width: 900px;
        max-width: 100%;
        aspect-ratio: 900 / 608;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      #stage canvas { position: absolute; left: 0; top: 0; width: 100%; }
      #world { height: calc(520 / 608 * 100%); }
      #game { height: 100%; cursor: crosshair; }
      #hint {
        font-size: 0.85rem;
        opacity: 0.8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="world"></canvas><canvas id="game"></canvas></div>
    <div id="hint">
      도로를 깔고 그 옆에 집·가게·공장을 지으면 저절로 커져요 · 클릭/드래그로 짓기 · 숫자 1-5 또는 아래 버튼으로 도구 선택 · WASD/방향키 이동 · Q/E·우클릭 드래그로 회전 · 휠로 확대/축소 · 휠클릭 드래그/미니맵으로 이동 · Esc 선택 취소 · 스페이스 일시정지 · 💾 메뉴로 저장/불러오기(자동 저장) · M 소리
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
