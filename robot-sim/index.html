<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로봇 조종 시뮬레이터</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        font-family: 'Consolas', 'Malgun Gothic', monospace;
      }
      canvas { display: block; }

      /* ---------- Title screen ---------- */
      #title-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: radial-gradient(circle at 50% 30%, #182334 0%, #05070c 75%);
        color: #d7e6ff;
        z-index: 20;
      }
      #title-screen h1 {
        font-size: clamp(1.8rem, 6vw, 3rem);
        margin: 0 0 0.3rem;
        letter-spacing: 0.08em;
        color: #5fd0ff;
        text-shadow: 0 0 18px rgba(95, 208, 255, 0.6);
      }
      #title-screen .subtitle { opacity: 0.75; font-size: 0.9rem; margin-bottom: 1.8rem; }
      #title-screen .hint {
        max-width: 480px; font-size: 0.78rem; line-height: 1.7; opacity: 0.65; margin-top: 1.6rem;
      }
      .mech-btn {
        font-family: inherit;
        padding: 0.8rem 2.4rem;
        background: linear-gradient(180deg, #2a84c7, #1a5a94);
        color: #fff;
        font-weight: bold;
        letter-spacing: 0.05em;
        border: 1px solid #6fd0ff;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(95, 208, 255, 0.35);
      }
      .mech-btn:hover { background: linear-gradient(180deg, #3694d9, #2169a6); }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none;
      }
      #crosshair {
        position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(120, 220, 255, 0.85);
        border-radius: 50%;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: rgba(120, 220, 255, 0.85);
      }
      #crosshair::before { left: 50%; top: -8px; width: 2px; height: 8px; transform: translateX(-50%); }
      #crosshair::after { left: 50%; bottom: -8px; width: 2px; height: 8px; transform: translateX(-50%); }

      #bars-panel {
        position: absolute; left: 16px; bottom: 16px; width: 240px;
        display: flex; flex-direction: column; gap: 6px;
        background: rgba(8, 14, 24, 0.55); border: 1px solid rgba(120, 180, 230, 0.3);
        border-radius: 6px; padding: 10px 12px;
      }
      .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.68rem; color: #bcd9ff; }
      .bar-label { width: 38px; flex-shrink: 0; }
      .bar-bg { flex: 1; height: 10px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; border: 1px solid rgba(120,180,230,0.25); }
      .bar-fill { height: 100%; transition: width 0.15s linear; }
      #hp-fill { background: linear-gradient(90deg, #ff5a5a, #ff9a5a); }
      #heat-fill { background: linear-gradient(90deg, #ffcf4d, #ff6b4d); }
      #energy-fill { background: linear-gradient(90deg, #4dd2ff, #4d8bff); }
      #overheat-tag {
        font-size: 0.7rem; color: #ff6b6b; text-align: center; margin-top: 2px; opacity: 0;
        text-shadow: 0 0 6px rgba(255,80,80,0.8);
      }

      #top-panel {
        position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 18px; background: rgba(8, 14, 24, 0.55);
        border: 1px solid rgba(120, 180, 230, 0.3); border-radius: 6px;
        padding: 6px 18px; font-size: 0.78rem; color: #bcd9ff;
      }
      #top-panel b { color: #5fd0ff; }

      #ammo-panel {
        position: absolute; right: 16px; bottom: 16px; text-align: right;
        background: rgba(8, 14, 24, 0.55); border: 1px solid rgba(120, 180, 230, 0.3);
        border-radius: 6px; padding: 10px 14px; font-size: 0.75rem; color: #bcd9ff;
      }
      #ammo-panel .missile-count { font-size: 1.1rem; color: #ffcf4d; font-weight: bold; }

      #radar-wrap {
        position: absolute; right: 16px; top: 14px;
        background: rgba(8, 14, 24, 0.6); border: 1px solid rgba(120, 180, 230, 0.35);
        border-radius: 50%; padding: 4px;
      }
      #radar { display: block; border-radius: 50%; }

      #hit-flash {
        position: absolute; inset: 0; background: rgba(255, 30, 30, 0.35); opacity: 0;
      }

      #wave-banner {
        position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
        font-size: 1.6rem; color: #5fd0ff; text-shadow: 0 0 16px rgba(95,208,255,0.8);
        letter-spacing: 0.1em; opacity: 0; text-align: center;
      }

      /* ---------- End screens ---------- */
      #end-screen {
        position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; background: rgba(5, 7, 12, 0.92); color: #d7e6ff; z-index: 30;
      }
      #end-screen h2 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 0 0 0.6rem; letter-spacing: 0.06em; }
      #end-screen .stats { font-size: 0.85rem; opacity: 0.75; margin-bottom: 1.6rem; line-height: 1.8; }

      #pause-overlay {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(5, 7, 12, 0.72); color: #bcd9ff; font-size: 1.1rem; letter-spacing: 0.05em;
        z-index: 25; cursor: pointer;
      }

      @media (max-width: 640px) {
        #bars-panel { width: 190px; }
        #radar-wrap { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="title-screen">
      <h1>로봇 조종 시뮬레이터</h1>
      <div class="subtitle">파일럿이 되어 적 로봇의 침공을 막아내세요</div>
      <button class="mech-btn" id="start-btn">출격</button>
      <div class="hint">
        WASD 이동 · 마우스로 기체 조준/선회 (클릭해서 시점 고정) · 좌클릭 블래스터 발사 · 우클릭 유도 미사일 발사<br/>
        Shift 부스트 대시 · 블래스터는 과열되면 잠시 발사가 멈춰요 · 모든 적을 격파하면 다음 웨이브로 진행합니다
      </div>
    </div>

    <div id="hud">
      <div id="hit-flash"></div>
      <div id="top-panel">
        <span>WAVE <b id="wave-num">1</b> / <span id="wave-total">5</span></span>
        <span>격파 <b id="kill-count">0</b></span>
      </div>
      <div id="radar-wrap"><canvas id="radar" width="120" height="120"></canvas></div>
      <div id="crosshair"></div>
      <div id="wave-banner"></div>
      <div id="bars-panel">
        <div class="bar-row"><span class="bar-label">HP</span><div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div></div>
        <div class="bar-row"><span class="bar-label">HEAT</span><div class="bar-bg"><div class="bar-fill" id="heat-fill" style="width:0%"></div></div></div>
        <div class="bar-row"><span class="bar-label">BOOST</span><div class="bar-bg"><div class="bar-fill" id="energy-fill" style="width:100%"></div></div></div>
        <div id="overheat-tag">⚠ OVERHEAT</div>
      </div>
      <div id="ammo-panel">
        <div>MISSILE</div>
        <div class="missile-count"><span id="missile-count">6</span>/6</div>
      </div>
    </div>

    <div id="pause-overlay">일시정지 — 클릭해서 재개</div>

    <div id="end-screen">
      <h2 id="end-title">MISSION COMPLETE</h2>
      <div class="stats" id="end-stats"></div>
      <button class="mech-btn" id="retry-btn">다시 출격</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
